name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - run: uv sync --frozen --extra test --python 3.12
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - run: uv sync --frozen --extra test --extra windows --python 3.12
      - run: uv run pytest -q tests/test_core.py
