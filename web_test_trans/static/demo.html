<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>录制演示 · Web Test Trans</title><style>body{font:15px system-ui;background:#f4f7f5;padding:50px;color:#234035}main{max-width:800px;margin:auto}section{background:white;padding:25px;margin:20px 0;border-radius:12px}input,select,button{font:inherit;padding:10px;margin:8px;border:1px solid #d8e2db;border-radius:5px}button{background:#187d60;color:white;cursor:pointer}label{display:block}.toast{position:fixed;right:30px;top:25px;background:#244c3a;color:white;padding:18px;border-radius:8px;z-index:2}iframe{width:100%;height:190px;border:1px solid #ddd;border-radius:8px}.drag-source,.drop-zone{display:inline-block;padding:30px;background:#eaf4ee;border:1px dashed #9fbca9;margin:10px}.drop-zone{min-width:200px}</style></head><body><main class="demo-app"><h1>录制演示页面</h1><p>试试输入、快捷键、勾选、双击、滚动、拖拽和 iframe 内的操作。</p><section class="profile-form"><h2>账号设置</h2><div class="fields"><label>用户名<input class="username" placeholder="输入测试用户名"></label><label>密码<input class="password" type="password"></label><label>方案<select class="plan"><option value="basic">基础版</option><option value="pro">专业版</option></select></label><label><input class="agree" type="checkbox">接收通知</label></div><div class="form-actions"><button class="save-button" onclick="showToast('保存成功')">保存设置</button><button class="flash-button" onclick="showToast('短暂提示',180)">短时 Toast</button><button class="double-button" ondblclick="showToast('双击成功')">双击测试</button></div></section><section class="embedded"><h2>iframe 组件</h2><div class="frame-container"><iframe class="demo-frame" src="/demo/frame"></iframe></div></section><section class="drag-area"><h2>拖拽</h2><div class="drag-source" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','demo')">拖动此处</div><div class="drop-zone" ondragover="event.preventDefault()" ondrop="event.preventDefault();this.dataset.dropped='true';showToast('拖拽成功')">拖到这里</div></section><section><div class="links"><a class="new-window" href="/demo/frame" target="_blank">打开新窗口</a></div></section><div class="toast-container"></div></main><script>function showToast(text,duration=1800){const node=document.createElement('div');node.className='toast';node.setAttribute('role','alert');node.textContent=text;document.querySelector('.toast-container').append(node);setTimeout(()=>node.remove(),duration);}</script></body></html>
