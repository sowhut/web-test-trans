<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>iframe 测试</title><style>body{font:14px system-ui;padding:15px}input,button{padding:10px;border:1px solid #ddd;border-radius:4px}button{background:#247959;color:white}.toast{background:#e6f5eb;padding:10px;margin-top:10px}</style></head><body><main class="frame-app"><div class="frame-form"><input class="frame-input" placeholder="iframe 内输入"><button class="frame-save" onclick="const e=document.createElement('div');e.className='toast';e.setAttribute('role','alert');e.textContent='iframe 保存成功';document.querySelector('.notices').append(e);setTimeout(()=>e.remove(),1000)">iframe 保存</button></div><div class="notices"></div></main></body></html>
