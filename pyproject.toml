[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-test-trans"
version = "0.1.0"
description = "Local web and Windows UI recorder with reusable CSS/class locators"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "playwright>=1.51,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
windows = ["uiautomation>=2.0.20; sys_platform == 'win32'", "pynput>=1.7.7; sys_platform == 'win32'"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[project.scripts]
web-test-trans = "web_test_trans.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["web_test_trans"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
